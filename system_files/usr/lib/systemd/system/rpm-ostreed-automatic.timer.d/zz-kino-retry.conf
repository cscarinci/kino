# Belt for the wake-up race (see the service drop-in next door): if a run
# is still skipped - e.g. no network at all that morning - retry every 4h
# instead of waiting for tomorrow's 04:05. After a successful run this just
# re-checks the registry a few times a day, a no-op when nothing new exists.
[Timer]
OnUnitInactiveSec=4h
