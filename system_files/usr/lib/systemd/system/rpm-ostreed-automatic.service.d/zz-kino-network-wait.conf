# The uBlue base gates this service on an unmetered-network ExecCondition.
# On a laptop asleep at the 04:05 timer, Persistent= fires the service at
# wake-up - before Wi-Fi re-associates - so NetworkManager still reports
# Metered=0 (unknown), the condition fails, and nothing retries until the
# next 04:05, when the laptop is asleep again. Net effect: OS updates never
# stage on their own (observed on tpx1c: every run skipped, Jul 17-20 2026).
# Fix: wait up to 2 min for NM connectivity, then apply the metered check.
# ExecCondition= is a list setting; the empty assignment clears the base
# entry (this file sorts after the base override.conf, so the reset wins).
[Service]
ExecCondition=
ExecCondition=/bin/bash -c 'nm-online -q -t 120 && [[ "$(busctl get-property org.freedesktop.NetworkManager /org/freedesktop/NetworkManager org.freedesktop.NetworkManager Metered | cut -c 3-)" == @(2|4) ]]'
